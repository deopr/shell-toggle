# | Caelestia keybinds (Hyprland) |
# Active when caelestia is the running shell.
#
# These call caelestia's own IPC targets directly rather than going through
# shellctl, so nothing is translated between shells.
#
# Target names verified against `qs -c caelestia ipc show`:
#   drawers        toggle(drawer)  drawer ∈ launcher/dashboard/utilities/
#                                    sidebar/session/osd
#   controlCenter  open()
#   clipboard      open()
#   wallpaper      openMenu()
#   picker         open()  area select -> file
#                  openClip()  area select -> clipboard

bind = SUPER, Space, exec, qs -c caelestia ipc call drawers toggle launcher
bind = SUPER, S, exec, qs -c caelestia ipc call controlCenter open
bind = SUPER SHIFT, S, exec, qs -c caelestia ipc call drawers toggle dashboard
bind = SUPER, W, exec, qs -c caelestia ipc call wallpaper openMenu
bind = SUPER, C, exec, qs -c caelestia ipc call clipboard open
bind = SUPER SHIFT, Q, exec, qs -c caelestia ipc call drawers toggle session

# Caelestia has one area-pick tool, so region and fullscreen both open it.
bind = SUPER, P, exec, qs -c caelestia ipc call picker open
bind = SUPER SHIFT, P, exec, qs -c caelestia ipc call picker open
bind = SUPER ALT, P, exec, qs -c caelestia ipc call picker openClip
