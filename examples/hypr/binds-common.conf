# | Common keybinds (Hyprland) |
# Shell-independent: the toggle, media keys, and brightness.
# These stay live no matter which shell is active.
#
# Hyprland syntax: mods are space-separated, the action is `exec`.
# Source this from hyprland.conf:
#   source = ~/.config/hypr/cfg/binds-common.conf

# Swap the status shell. The key is read from the live config every time,
# so this keeps working after the shell-specific binds are replaced.
bind = SUPER SHIFT, Page_Up, exec, ~/.local/bin/shell-toggle
bind = SUPER SHIFT, Page_Down, exec, ~/.local/bin/shell-toggle status

# Media keys go through shellctl (wpctl/playerctl), not through the shell.
bind = , XF86AudioRaiseVolume, exec, ~/.local/bin/shellctl volume-up
bind = , XF86AudioLowerVolume, exec, ~/.local/bin/shellctl volume-down
bind = , XF86AudioMute, exec, ~/.local/bin/shellctl volume-mute
bind = , XF86AudioMicMute, exec, ~/.local/bin/shellctl mic-mute
bind = , XF86AudioNext, exec, ~/.local/bin/shellctl media next
bind = , XF86AudioPrev, exec, ~/.local/bin/shellctl media previous
bind = , XF86AudioPlay, exec, ~/.local/bin/shellctl media toggle

# Brightness.
bind = , XF86MonBrightnessUp, exec, ~/.local/bin/shellctl brightness-up
bind = , XF86MonBrightnessDown, exec, ~/.local/bin/shellctl brightness-down
