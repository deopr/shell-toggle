# | DMS keybinds (Hyprland) |
# Active when DMS (DankMaterialShell) is the running shell.
#
# These call DMS's own IPC targets directly rather than going through
# shellctl, so nothing is translated between shells.
#
# Target names verified against `dms ipc call` docs:
#   spotlight       toggle()           launcher
#   control-center  toggle()           quick settings
#   settings        focusOrToggle()
#   dash            toggle(wallpaper)  wallpaper picker
#   clipboard       toggle()
#   powermenu       toggle()           session menu

bind = SUPER, Space, exec, dms ipc call spotlight toggle
bind = SUPER, S, exec, dms ipc call control-center toggle
bind = SUPER SHIFT, S, exec, dms ipc call settings focusOrToggle
bind = SUPER, W, exec, dms ipc call dash toggle wallpaper
bind = SUPER, C, exec, dms ipc call clipboard toggle
bind = SUPER SHIFT, Q, exec, dms ipc call powermenu toggle

# Screenshots. DMS ships its own capture CLI with region/full/all modes.
bind = SUPER, P, exec, dms screenshot region
bind = SUPER SHIFT, P, exec, dms screenshot full
bind = SUPER ALT, P, exec, dms screenshot all

# DMS's keybind cheatsheet parses the live compositor config. The target
# name is compositor-specific; check `dms ipc call keybinds --help` and
# add it here if your DMS build supports Hyprland.
# bind = SUPER SHIFT, K, exec, dms ipc call keybinds toggle hyprland
