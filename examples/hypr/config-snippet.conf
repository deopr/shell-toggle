# Add these lines to ~/.config/hypr/hyprland.conf after copying
# binds-common.conf, binds-dms.conf, binds-caelestia.conf into
# ~/.config/hypr/cfg/ and symlinking binds-active.conf to one of them.
#
#   ln -sfn binds-dms.conf ~/.config/hypr/cfg/binds-active.conf
#
# and set this in ~/.config/shell-toggle/config:
#
#   BINDS_LINK="$HOME/.config/hypr/cfg/binds-active.conf"
#
source = ~/.config/hypr/cfg/binds-common.conf
source = ~/.config/hypr/cfg/binds-active.conf
