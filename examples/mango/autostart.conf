# | Auto Start |
# autostart your favorite applications here

# Absolute paths throughout: mango inherits SDDM's PATH, which does not
# include ~/.local/bin, so a bare `shellctl` would fail as "command not
# found" and the bind would silently do nothing.
exec_once = ~/.local/bin/shell-start &

# Keeps the stored wallpaper identical between DMS and caelestia, so
# pressing the toggle never changes your background.
exec_once = ~/.local/bin/wallpaper-sync &

# Optional: show the keybinds once, a few seconds into the first session.
exec_once = sleep 3 && ~/.local/bin/shellctl panel-toggle keybind-cheatsheet
