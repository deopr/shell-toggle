# | Caelestia keybinds |
# Active when caelestia is the running shell.
#
# These call caelestia's own IPC targets directly rather than going through
# shellctl. That is the point of splitting the binds per shell: in this
# mode nothing is translated, so there is no guessing at target names and
# no failed call can hit the wrong function.
#
# Target names verified against `qs -c caelestia ipc show`:
#   drawers        toggle(drawer)  drawer ∈ launcher/dashboard/utilities/
#                                    sidebar/session/osd
#   controlCenter  open()
#   clipboard      open()
#   wallpaper      openMenu()
#   picker         open()  area select -> file
#                  openClip()  area select -> clipboard

bind = SUPER, space, spawn, qs -c caelestia ipc call drawers toggle launcher
bind = SUPER, s, spawn, qs -c caelestia ipc call controlCenter open
bind = SUPER+SHIFT, s, spawn, qs -c caelestia ipc call drawers toggle dashboard
bind = SUPER, w, spawn, qs -c caelestia ipc call wallpaper openMenu
bind = SUPER, c, spawn, qs -c caelestia ipc call clipboard open
bind = SUPER+SHIFT, q, spawn, qs -c caelestia ipc call drawers toggle session

# Screenshots. Caelestia has one area-pick tool, so region and fullscreen
# both open it; there is no separate whole-output capture target.
bind = SUPER, p, spawn, qs -c caelestia ipc call picker open
bind = SUPER+SHIFT, p, spawn, qs -c caelestia ipc call picker open
bind = SUPER+ALT, p, spawn, qs -c caelestia ipc call picker openClip
