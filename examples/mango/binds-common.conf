# | Common keybinds |
# Shell-independent: windows, workspaces, focus, media, layout.
# Sourced by keybinds.conf alongside whichever shell's binds are active,
# so these stay live no matter which shell is running.
# https://mangowm.github.io/docs/bindings/keys

# Applications
bind = SUPER, Return, spawn, kitty
bind = SUPER, e, spawn, nautilus
bind = SUPER, b, spawn, firefox

bind = SUPER, q, killclient,

# Reload config
bind = SUPER, r, reload_config

# Swap the status shell between DMS and caelestia.
# Lives here, in the common set, so it keeps working after the swap has
# replaced the shell-specific binds. PgUp/Next are Mango's Prior/Next,
# both within thumb reach of the arrow cluster on a 65% and not a chord
# games bind.
bind = SUPER+SHIFT, Prior, spawn, ~/.local/bin/shell-toggle
# Report the active shell without switching.
bind = SUPER+SHIFT, Next, spawn, ~/.local/bin/shell-toggle status

# Media keys. Routed through shellctl, which drives wpctl/playerctl
# natively rather than asking a shell - so these behave identically in
# both modes and cannot break when the shell changes.
bind = NONE, XF86AudioRaiseVolume, spawn, ~/.local/bin/shellctl volume-up
bind = NONE, XF86AudioLowerVolume, spawn, ~/.local/bin/shellctl volume-down
bind = NONE, XF86AudioMute, spawn, ~/.local/bin/shellctl volume-mute
bind = NONE, XF86AudioMicMute, spawn, ~/.local/bin/shellctl mic-mute
bind = NONE, XF86AudioNext, spawn, ~/.local/bin/shellctl media next
bind = NONE, XF86AudioPrev, spawn, ~/.local/bin/shellctl media previous
bind = NONE, XF86AudioPlay, spawn, ~/.local/bin/shellctl media toggle
# XF86AudioPause resolves to the same internal key as XF86AudioPlay, so
# mango rejects the second binding. Only one of the two can ever be active.

# Brightness. If no backlight device exists, shellctl
# reports that once rather than failing silently on every press.
bind = NONE, XF86MonBrightnessUp, spawn, ~/.local/bin/shellctl brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, ~/.local/bin/shellctl brightness-down

# Switch window focus
bind = SUPER, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# Swap window
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right

# Window state
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, toggleoverview,
bind = SUPER, v, togglefloating,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER, o, toggleoverlay,
bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER, z, toggle_scratchpad

# Scroller layout
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = SUPER, x, switch_proportion_preset,

bind = SUPER, n, switch_layout

# Workspaces
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

bind = SUPER+SHIFT ,1, tag, 1, 0
bind = SUPER+SHIFT ,2, tag, 2, 0
bind = SUPER+SHIFT ,3, tag, 3, 0
bind = SUPER+SHIFT ,4, tag, 4, 0
bind = SUPER+SHIFT ,5, tag, 5, 0
bind = SUPER+SHIFT ,6, tag, 6, 0
bind = SUPER+SHIFT ,7, tag, 7, 0
bind = SUPER+SHIFT ,8, tag, 8, 0
bind = SUPER+SHIFT ,9, tag, 9, 0

# Monitors
bind = ALT+SHIFT, Left, focusmon, left
bind = ALT+SHIFT, Right, focusmon, right
bind = SUPER+ALT, Left, tagmon, left
bind = SUPER+ALT, Right, tagmon, right

# Gaps
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1
bind = SUPER+SHIFT, R, togglegaps

# Move / resize
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50,+0
bind = CTRL+SHIFT, Right, movewin, +50,+0

bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = NONE, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize
