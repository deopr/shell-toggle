# | DMS keybinds |
# Active when DMS (DankMaterialShell) is the running shell.
#
# These call DMS's own IPC targets directly rather than going through
# shellctl. That is the point of splitting the binds per shell: in this
# mode nothing is translated, so there is no guessing at target names and
# no failed call can hit the wrong function.
#
# Target names verified against `dms ipc call` docs:
#   spotlight       toggle()           launcher
#   control-center  toggle()           quick settings
#   settings        focusOrToggle()
#   dash            toggle(wallpaper)  wallpaper picker
#   clipboard       toggle()
#   powermenu       toggle()           session menu
#   keybinds        toggle(mangowc)    cheatsheet parsed from the live
#                                      mango config

bind = SUPER, space, spawn, dms ipc call spotlight toggle
bind = SUPER, s, spawn, dms ipc call control-center toggle
bind = SUPER+SHIFT, s, spawn, dms ipc call settings focusOrToggle
bind = SUPER, w, spawn, dms ipc call dash toggle wallpaper
bind = SUPER, c, spawn, dms ipc call clipboard toggle
bind = SUPER+SHIFT, q, spawn, dms ipc call powermenu toggle

# Screenshots. DMS ships its own capture CLI with region/full/all modes.
bind = SUPER, p, spawn, dms screenshot region
bind = SUPER+SHIFT, p, spawn, dms screenshot full
bind = SUPER+ALT, p, spawn, dms screenshot all

# Keybind cheatsheet, parsed from the live mango config by DMS itself.
bind = SUPER+SHIFT, k, spawn, dms ipc call keybinds toggle mangowc
