# | Keybinds |
# Master file. Composes the shell-independent binds with whichever
# shell's binds are currently active.
#
# binds-active.conf is a symlink that shell-toggle flips between
# binds-dms.conf and binds-caelestia.conf. Because mango is running
# with auto_reload_config = 1, the swap takes effect on its own and no
# reload has to be sent by hand - which is what makes the switch feel
# like nothing happened at all.
#
# To change a bind, edit binds-common.conf / binds-dms.conf /
# binds-caelestia.conf - never this file.

source = ./cfg/binds-common.conf
source = ./cfg/binds-active.conf
